version: '3.8'

services:
  backend1:
    build: ./backend
    environment:
      - SERVER_NAME=Backend Server 1

  backend2:
    build: ./backend
    environment:
      - SERVER_NAME=Backend Server 2

  backend3:
    build: ./backend
    environment:
      - SERVER_NAME=Backend Server 3

  loadbalancer:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend1
      - backend2
      - backend3

